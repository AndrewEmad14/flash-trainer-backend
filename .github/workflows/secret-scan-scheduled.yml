# Weekly full-history secret scan of main (constitution CI: "full-history scan SHOULD run on a schedule").
name: Scheduled secret scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.100.1
        with:
          base: ''
          head: main
          # The action already passes --fail, so it must not be repeated here.
          version: 3.100.1
          extra_args: --results=verified
