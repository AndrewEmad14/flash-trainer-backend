# Local development dependencies. Dev DB: flash_trainer, e2e test DB: flash_trainer_test.
services:
  postgres:
    image: postgres:16
    container_name: flash-trainer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash_dev_password
      POSTGRES_DB: flash_trainer
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flash -d flash_trainer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
